name: Rebase open branches

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: rebase-open-branches
  cancel-in-progress: false

jobs:
  # The shared workflow from devops-tools. Keep the ref and devops-tools-version equal to the
  # devops-tools pin in tools/devops/pyproject.toml, and move them in one PR together with
  # changelog-fragments.yml.
  rebase-open-branches:
    uses: SETA1609/devops_tools/.github/workflows/rebase-open-branches.yml@1fae926966890801f64913193ba41c65111b81c3 # issue-12 branch; re-pin to its merge commit on main (M5-76)
    with:
      devops-tools-version: 1fae926966890801f64913193ba41c65111b81c3
      settings-file: tools/devops/pyproject.toml
