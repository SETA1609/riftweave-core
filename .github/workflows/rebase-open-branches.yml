name: Rebase open branches

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: rebase-open-branches
  cancel-in-progress: false

jobs:
  # The shared workflow from devops-tools. Keep the ref and devops-tools-version equal to the
  # devops-tools pin in tools/devops/pyproject.toml, and move them in one PR together with
  # changelog-fragments.yml.
  rebase-open-branches:
    uses: SETA1609/devops_tools/.github/workflows/rebase-open-branches.yml@15c1bf161101353bacc7c7f3f8d36076eda10796 # v0.2.0
    with:
      devops-tools-version: 15c1bf161101353bacc7c7f3f8d36076eda10796
      settings-file: tools/devops/pyproject.toml
