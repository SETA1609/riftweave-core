name: Rebase open branches

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: rebase-open-branches
  cancel-in-progress: false

jobs:
  # The shared workflow from devops-tools. Keep the ref and devops-tools-version equal to the
  # devops-tools pin in tools/devops/pyproject.toml, and move all three in one PR.
  rebase-open-branches:
    uses: SETA1609/devops_tools/.github/workflows/rebase-open-branches.yml@52c33bf85c986e181c2a9088da1043b114c65834 # main, 2026-11-01
    with:
      devops-tools-version: 52c33bf85c986e181c2a9088da1043b114c65834
