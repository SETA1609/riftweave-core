name: Roadmap order

on:
  pull_request:
    branches:
      - main
    paths:
      - docs/stories/**
      - ROADMAP.md
      - tools/devops/pyproject.toml
      - tools/devops/uv.lock
      - .github/workflows/roadmap-order.yml

permissions:
  contents: read

jobs:
  check-roadmap-order:
    name: Check the roadmap story table is current
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # devops-tools is pinned to a commit in tools/devops/pyproject.toml and uv.lock.
      - name: Check the roadmap order table
        run: uv run --project tools/devops --locked --no-dev devops-tools roadmap-order --settings-file tools/devops/pyproject.toml check
