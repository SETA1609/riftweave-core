# After a pull request merges, move its issue from docs/issues/open to docs/issues/done when its
# status is review, regenerate the table in docs/issues/order.md, and commit that to main.
name: Close merged issue

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

jobs:
  # Keep the ref and devops-tools-version equal to the devops-tools pin in tools/devops/pyproject.toml.
  close-merged-issue:
    uses: SETA1609/devops_tools/.github/workflows/close-merged-issue.yml@5458d06de23067e53e41a7b883bd3f483bc62a92 # main after v0.3.0
    with:
      devops-tools-version: 5458d06de23067e53e41a7b883bd3f483bc62a92
      settings-file: tools/devops/pyproject.toml
