name: Changelog fragments

# Every pull request adds changes/<issue-id>.md instead of a CHANGELOG.md line (changes/README.md).
# No paths filter: the branch's issue needs a fragment whatever else the pull request touches.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # The shared workflow from devops-tools runs `changelog-fragments check --branch <head ref>`.
  # Keep the ref and devops-tools-version equal to the devops-tools pin in
  # tools/devops/pyproject.toml, and move them in one PR with rebase-open-branches.yml.
  check-changelog-fragments:
    uses: SETA1609/devops_tools/.github/workflows/changelog-fragments.yml@15c1bf161101353bacc7c7f3f8d36076eda10796 # v0.2.0
    with:
      devops-tools-version: 15c1bf161101353bacc7c7f3f8d36076eda10796
      settings-file: tools/devops/pyproject.toml
