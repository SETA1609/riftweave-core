name: Validate Ruleset

on:
  push:
    paths:
      - "ruleset/**"
  pull_request:
    paths:
      - "ruleset/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r ruleset/requirements.txt

      - name: Validate JSON data against schemas
        run: python ruleset/scripts/validate.py
