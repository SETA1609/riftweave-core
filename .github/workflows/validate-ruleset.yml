name: Validate Ruleset

on:
  push:
    paths:
      - "ruleset/**"
      - ".github/**"
      - "Dockerfile"
      - "docs/core/**"
      - "docs/stories/**"
      - "backend/**"
      - "docs/backend/**"
  pull_request:
    paths:
      - "ruleset/**"
      - ".github/**"
      - "Dockerfile"
      - "docs/core/**"
      - "docs/stories/**"
      - "backend/**"
      - "docs/backend/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r ruleset/requirements.txt

      - name: Validate JSON data against schemas
        run: python ruleset/scripts/validate.py

      - name: Run unit tests
        run: python -m unittest discover -s ruleset/scripts -p "test_[!v]*.py" -v

      - name: Run golden vectors
        run: python -m unittest discover -s ruleset/scripts -p "test_vectors.py" -v

      - name: Balance report (gate checks fail, warn checks are listed)
        run: python ruleset/scripts/balance_report.py --gate

  # The Go core (APP-02) runs every golden vector, so a data or rule change that breaks one
  # fails here and in the Python job above.
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Check formatting and vet
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...

      - name: Run every golden vector in Go
        working-directory: backend
        run: go test ./... -count=1
