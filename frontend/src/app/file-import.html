<rw-card title="Import">
  <p class="note">A character, a session, a spell, or a settings file exported by this app or by the CLI (<code>riftweave export</code>).</p>
  <label class="btn btn-primary">Open file <input type="file" accept=".json,application/json" (change)="pick($event)" /></label>
  <rw-alert [message]="error()" />
  @if (alert(); as text) {
    <rw-alert kind="info" [message]="text" />
    <div class="actions">
      <button type="button" class="btn btn-primary" (click)="enable()">Enable and import</button>
      <button type="button" class="btn btn-outline" (click)="acceptLoss()">Import anyway</button>
    </div>
  }
  @for (warning of warnings(); track warning) {
    <rw-alert kind="info" [message]="warning" />
  }
  @if (notice()) {
    <rw-alert kind="success" [message]="notice()" />
  }
</rw-card>
