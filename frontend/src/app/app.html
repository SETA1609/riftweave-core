<header>
  <h1>Riftweave</h1>
  <nav class="nav">
    @for (tab of tabs; track tab) {
      <button type="button" class="nav-link" [class.active]="tab === current()" (click)="current.set(tab)">{{ tab }}</button>
    }
  </nav>
</header>
<main>
  @switch (state()) {
    @case ('starting') { <rw-alert kind="info" message="Starting the rules engine…" /> }
    @case ('failed') { <rw-alert [message]="failure()" /> }
    @default {
      @switch (current()) {
        @case ('sheet') { <rw-sheet /> }
        @case ('attack') { <rw-attack /> }
        @case ('playthrough') { <rw-playthrough /> }
      }
    }
  }
</main>
