<header>
  <h1><a routerLink="/">Riftweave</a></h1>
  <div class="tools">
    <rw-language-select />
    <rw-theme-toggle />
  </div>
</header>
<main>
  @switch (state()) {
    @case ('starting') { <rw-alert kind="info" [message]="'app.starting' | t" /> }
    @case ('failed') { <rw-alert [message]="'app.failed' | t: { reason: failure() }" /> }
    @default { <router-outlet /> }
  }
</main>
<footer>{{ 'app.rules' | t: { version: rulesVersion } }}</footer>
