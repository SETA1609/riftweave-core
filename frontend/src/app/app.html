<header>
  <h1><a routerLink="/">Riftweave</a></h1>
  <rw-theme-toggle />
</header>
<main>
  @switch (state()) {
    @case ('starting') { <rw-alert kind="info" message="Starting the rules engine…" /> }
    @case ('failed') { <rw-alert [message]="failure()" /> }
    @default { <router-outlet /> }
  }
</main>
<footer>Rules {{ rulesVersion }}</footer>
