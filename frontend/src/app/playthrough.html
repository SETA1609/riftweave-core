<rw-card [title]="'playthrough.title' | t">
  <button type="button" class="btn btn-primary" (click)="run()">{{ 'playthrough.run' | t }}</button>
  <rw-alert [message]="error()" />
  <ol>
    @for (row of rows(); track row.name) {
      <li [class.mismatch]="!row.matches">
        <b>{{ row.name }}</b> {{ (row.matches ? 'playthrough.matches' : 'playthrough.differs') | t }}
        <details><summary>{{ 'playthrough.input_and_result' | t }}</summary><pre>{{ row.input | json }}</pre><pre>{{ row.result | json }}</pre></details>
      </li>
    }
  </ol>
  @if (replayed() !== null) {
    <rw-alert [kind]="replayed() ? 'success' : 'danger'" [message]="(replayed() ? 'playthrough.replay_matches' : 'playthrough.replay_differs') | t" />
  }
</rw-card>
