@switch (section()) {
  @case ('settings') {
    <rw-card [title]="'menu.settings' | t">
      <rw-select-field [label]="'settings.theme' | t" [options]="themes()" [value]="context.theme()" (valueChange)="setTheme($event)" />
      <label class="field"><input type="checkbox" [checked]="context.playersSeeOnlyKnown()" (change)="report(context.setPlayersSeeOnlyKnown($any($event.target).checked))" /> {{ 'settings.players_see_only_known' | t }}</label>
      <button type="button" class="btn btn-outline" (click)="exportSettings()">{{ 'settings.export' | t }}</button>
      <label class="btn btn-outline">{{ 'settings.import' | t }} <input type="file" accept=".json,application/json" (change)="importSettings($event)" /></label>
    </rw-card>
  }
  @case ('modules') {
    <rw-card [title]="'menu.modules' | t">
      <label class="field"><input type="checkbox" checked disabled /> {{ 'modules.core' | t }}</label>
      @for (id of moduleIds; track id) {
        <label class="field"><input type="checkbox" [checked]="context.modules().includes(id)" (change)="report(context.toggleModule(id))" /> {{ id }}</label>
      }
    </rw-card>
  }
  @case ('network') {
    <rw-card [title]="'menu.network' | t">
      <label class="field"><input type="radio" name="network" [checked]="context.networkMode() === 'local'" (change)="report(context.setNetwork('local'), 'network.offline_notice')" /> {{ 'network.offline' | t }}</label>
      <label class="field"><input type="radio" name="network" [checked]="context.networkMode() === 'server'" (change)="useServer()" /> {{ 'network.server' | t }}</label>
      <rw-text-field [label]="'network.server_url' | t" [(value)]="url" />
      <button type="button" class="btn btn-outline btn-sm" (click)="useServer()">{{ 'network.use_server' | t }}</button>
      <label class="field disabled"><input type="radio" name="network" disabled /> {{ 'network.room' | t }} ({{ roomIssue }})</label>
    </rw-card>
  }
}
<rw-alert [message]="problem()" />
<rw-alert kind="info" [message]="notice() | t" />
