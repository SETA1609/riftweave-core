<nav class="menu-grid" [attr.aria-label]="title()">
  @for (entry of entries(); track entry.key) {
    @if (entry.issue) {
      <span class="card menu-card disabled" aria-disabled="true">{{ entry.label }} <small>({{ entry.issue }})</small></span>
    } @else {
      <a class="card menu-card" [routerLink]="entry.path">{{ entry.label }}</a>
    }
  }
  @if (back(); as up) { <a class="card menu-card" [routerLink]="up">Back</a> }
</nav>
